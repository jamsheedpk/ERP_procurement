<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Meridian HRM — Admin</title>
<link rel="stylesheet" href="hrm.css" />
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
<link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml" />
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBwq37HvnCUs22Lpm2etp3X8LIr3QVZtdM&libraries=places" async defer></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="LoginPage.jsx"></script>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="DashboardPage.jsx"></script>
<script type="text/babel" src="PeoplePage.jsx"></script>
<script type="text/babel" src="LeavePage.jsx"></script>
<script type="text/babel" src="RecruitmentPage.jsx"></script>
<script type="text/babel" src="PayrollPage.jsx"></script>
<script type="text/babel" src="SalaryPage.jsx"></script>
<script type="text/babel" src="EmployeePortal.jsx"></script>
<script type="text/babel" src="AttendancePage.jsx"></script>
<script type="text/babel" src="PermissionsPage.jsx"></script>
<script type="text/babel" src="OrgChartPage.jsx"></script>
<script type="text/babel" src="OnboardingPage.jsx"></script>
<script type="text/babel" src="ShiftsPage.jsx"></script>
<script type="text/babel" src="BenefitsPage.jsx"></script>
<script type="text/babel" src="ExpensePage.jsx"></script>
<script type="text/babel" src="CashBookPage.jsx"></script>
<script type="text/babel" src="DayBookPage.jsx"></script>
<script type="text/babel" src="PartyPage.jsx"></script>
<script type="text/babel" src="ProjectPage.jsx"></script>
<script type="text/babel" src="QuotationPage.jsx"></script>
<script type="text/babel" src="ProjectReportPage.jsx"></script>
<script type="text/babel" src="PerformancePage.jsx"></script>
<script type="text/babel" src="TrainingPage.jsx"></script>
<script type="text/babel" src="DocumentsPage.jsx"></script>
<script type="text/babel" src="ReportsPage.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const API = "http://localhost:5000/api";

const TODAY = new Date(2026, 4, 21);
const FMT_DATE = (d) => {
  const m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return d.getDate() + " " + m[d.getMonth()] + " " + d.getFullYear();
};

const DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#3B3E8F",
  "density": "dense",
  "canvas": "cream"
}/*EDITMODE-END*/;

const ROUTE_CRUMBS = {
  dashboard: ["People & Culture", "Dashboard"],
  people:    ["People & Culture", "Employees"],
  org:       ["People & Culture", "Org chart"],
  onboard:   ["People & Culture", "Onboarding"],
  recruit:   ["People & Culture", "Recruitment"],
  leave:     ["People & Culture", "Leave"],
  attend:    ["People & Culture", "Attendance"],
  shifts:    ["People & Culture", "Shifts"],
  payroll:   ["People & Culture", "Payroll", "May 2026"],
  benefits:  ["People & Culture", "Benefits"],
  salary:    ["Money", "Salary"],
  expense:   ["People & Culture", "Expenses"],
  cashbook:  ["Finance", "Cash Book"],
  daybook:   ["Finance", "Day Book"],
  parties:   ["People & Culture", "Party"],
  projects:  ["Projects", "Pipeline"],
  quotations:["Projects", "Quotations"],
  projreport:["Projects", "P&L Report"],
  perf:      ["People & Culture", "Performance"],
  learn:     ["People & Culture", "Training"],
  docs:        ["People & Culture", "Documents & Contracts"],
  reports:     ["People & Culture", "Reports"],
  permissions: ["Settings", "Permissions & Roles"],
};

// Curated palettes — keyed by primary hex
const ACCENT_THEMES = {
  "#6F1947": { name: "Burgundy", magenta: "#B61B54", pink: "#F5989D", plum700: "#5B1239", plum50: "#FBF3F7", plum100: "#F4DDE8", plum200: "#E7B7CE", plum800: "#420C29", plum900: "#2A0719" },
  "#3B3E8F": { name: "Indigo",   magenta: "#5C4FC6", pink: "#A6B0E8", plum700: "#2D2F70", plum50: "#F0F1FA", plum100: "#DCDFF1", plum200: "#B6BCDF", plum800: "#222469", plum900: "#1B1D52" },
  "#1F5A3D": { name: "Forest",   magenta: "#2E7D54", pink: "#A8D2B9", plum700: "#163F2B", plum50: "#EEF6F1", plum100: "#D2E8DB", plum200: "#A8CFB7", plum800: "#0E2A1D", plum900: "#082015" },
  "#2A2326": { name: "Charcoal", magenta: "#5C5156", pink: "#A89DA3", plum700: "#1A1316", plum50: "#F3F0F2", plum100: "#E6E1E4", plum200: "#CFC7CC", plum800: "#1A1316", plum900: "#0F0A0C" },
};

function applyTheme(accent) {
  const t = ACCENT_THEMES[accent] || ACCENT_THEMES["#6F1947"];
  const r = document.documentElement.style;
  r.setProperty("--brand-burgundy", accent);
  r.setProperty("--brand-magenta",  t.magenta);
  r.setProperty("--brand-pink",     t.pink);
  r.setProperty("--plum-700",       t.plum700);
  r.setProperty("--plum-50",        t.plum50);
  r.setProperty("--plum-100",       t.plum100);
  r.setProperty("--plum-200",       t.plum200);
  r.setProperty("--plum-800",       t.plum800);
  r.setProperty("--plum-900",       t.plum900);
}

function App() {
  const [tweaks, setTweak] = useTweaks(DEFAULTS);
  const [route, setRoute]       = useState("dashboard");
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [openEmployee, setOpenEmployee] = useState(null);
  const [selectedLeave, setSelectedLeave] = useState(null);
  const [DATA, setData]         = useState(null);
  const [loading, setLoading]   = useState(true);
  const [error, setError]       = useState(null);

  // ── Auth ──────────────────────────────────────────────
  const [authUser,  setAuthUser]  = useState(() => {
    try { return JSON.parse(localStorage.getItem("hrm_user")) || null; } catch { return null; }
  });
  const [authToken, setAuthToken] = useState(() => localStorage.getItem("hrm_token") || null);
  const [authChecked, setAuthChecked] = useState(false);

  // Validate stored token on mount
  useEffect(() => {
    if (!authToken) { setAuthChecked(true); return; }
    fetch(`${API}/auth/me`, { headers: { Authorization: `Bearer ${authToken}` } })
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(user => { setAuthUser(user); setAuthChecked(true); })
      .catch(() => {
        localStorage.removeItem("hrm_token");
        localStorage.removeItem("hrm_user");
        setAuthUser(null); setAuthToken(null); setAuthChecked(true);
      });
  }, []);

  const handleLogin = (user, token) => {
    setAuthUser(user);
    setAuthToken(token);
  };

  const handleLogout = () => {
    localStorage.removeItem("hrm_token");
    localStorage.removeItem("hrm_user");
    setAuthUser(null);
    setAuthToken(null);
    setData(null);
    setLoading(true);
  };

  // Fetch all data from API on mount
  useEffect(() => {
    Promise.all([
      fetch(`${API}/employees`).then(r => r.json()),
      fetch(`${API}/departments`).then(r => r.json()),
      fetch(`${API}/leave-requests`).then(r => r.json()),
      fetch(`${API}/openings`).then(r => r.json()),
      fetch(`${API}/candidates`).then(r => r.json()),
      fetch(`${API}/payroll/latest`).then(r => r.json()),
      fetch(`${API}/renewals`).then(r => r.json()),
      fetch(`${API}/activity`).then(r => r.json()),
      fetch(`${API}/leave-types`).then(r => r.json()),
      fetch(`${API}/attendance/today?date=2026-05-21`).then(r => r.json()),
      fetch(`${API}/attendance/week?date=2026-05-21`).then(r => r.json()),
      fetch(`${API}/headcount/trend`).then(r => r.json()),
      fetch(`${API}/calendar-events?month=2026-05`).then(r => r.json()),
      fetch(`${API}/documents?status=pending_signature`).then(r => r.json()),
    ]).then(([employees, departments, leaveRequests, openings, candidates, payrollRun, renewals, activity, leaveTypes, attendanceToday, weekAttendance, headcountTrend, monthEvents, pendingDocs]) => {
      // Normalize: add `id` alias so pages work without changes
      const emps  = employees.map(e     => ({ ...e, id: e.empId }));
      const depts = departments.map(d   => ({ ...d, id: d.deptId }));
      const lvs   = leaveRequests.map(l => ({ ...l, id: l.leaveId }));
      const jobs  = openings.map(o      => ({ ...o, id: o.jobId }));
      const cands = candidates.map(c    => ({ ...c, id: c.candidateId }));
      // Normalize leave types: add `id` alias from `typeId`
      const types = leaveTypes.map(t => ({ ...t, id: t.typeId }));

      setData({
        employees: emps,
        departments: depts,
        leaveRequests: lvs,
        openings: jobs,
        candidates: cands,
        payrollRun,
        renewals,
        activity,
        leaveTypes: types,
        attendanceToday,
        weekAttendance,
        headcountTrend,
        monthEvents,
        pendingDocs: Array.isArray(pendingDocs) ? pendingDocs : [],
        // Company summary derived from live data
        company: {
          name: "Meridian Logistics DMCC",
          short: "Meridian",
          headcount: emps.length,
          activeToday: emps.filter(e => e.status === "active").length,
          onLeave: emps.filter(e => e.status === "on-leave").length,
          pendingLeaves: lvs.filter(l => l.status === "pending").length,
          expiringDocs: renewals.filter(r => r.severity === "danger" || r.severity === "warning").length,
          openRoles: jobs.length,
          payrollDue: payrollRun.runDate || "—",
          nextPayroll: payrollRun.gross ? "AED " + payrollRun.gross.toLocaleString() : "—",
        },
        today: TODAY,
        fmtDate: FMT_DATE,
      });
      setLoading(false);
    }).catch(err => {
      console.error("API error:", err);
      setError("Could not connect to the HRM server. Make sure it is running on port 5000.");
      setLoading(false);
    });
  }, []);

  // Apply theme
  useEffect(() => { applyTheme(tweaks.accent); }, [tweaks.accent]);
  useEffect(() => { document.body.classList.toggle("dense", tweaks.density === "dense"); }, [tweaks.density]);
  useEffect(() => {
    document.body.classList.remove("warm","cool");
    if (tweaks.canvas === "warm") document.body.classList.add("warm");
    if (tweaks.canvas === "cool") document.body.classList.add("cool");
  }, [tweaks.canvas]);

  // Re-render lucide icons whenever route changes
  useEffect(() => {
    const t = setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 60);
    return () => clearTimeout(t);
  }, [route, openEmployee, selectedLeave, tweaks, DATA, authUser]);

  // ── Auth gate ─────────────────────────────────────────
  if (!authChecked) return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh" }}>
      <div style={{ width: 32, height: 32, border: "3px solid var(--plum-100)", borderTopColor: "var(--brand-burgundy)", borderRadius: "50%", animation: "spin 0.8s linear infinite" }} />
    </div>
  );

  if (!authUser) return <LoginPage onLogin={handleLogin} />;

  // Employee portal — personal view only, no full HRM
  if (authUser.userRole === "employee") {
    return <EmployeePortal authUser={authUser} token={authToken} onLogout={handleLogout} />;
  }

  if (loading) return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", flexDirection: "column", gap: 14, color: "var(--fg-3)" }}>
      <div style={{ width: 36, height: 36, border: "3px solid var(--plum-100)", borderTopColor: "var(--brand-burgundy)", borderRadius: "50%", animation: "spin 0.8s linear infinite" }} />
      <div style={{ fontSize: 13 }}>Loading HRM data…</div>
    </div>
  );

  if (error) return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", flexDirection: "column", gap: 10, color: "var(--fg-2)", padding: 40, textAlign: "center" }}>
      <div style={{ fontSize: 15, fontWeight: 600, color: "var(--danger-700)" }}>Connection error</div>
      <div style={{ fontSize: 13, maxWidth: 400 }}>{error}</div>
    </div>
  );

  // Generic add/update callbacks shared across pages
  const handleAdd = (type, item) => {
    setData(prev => {
      switch (type) {
        case "employee":     return { ...prev, employees: [...prev.employees, { ...item, id: item.empId }], company: { ...prev.company, headcount: prev.employees.length + 1, activeToday: prev.employees.filter(e => e.status === "active").length + 1 } };
        case "leaveRequest": return { ...prev, leaveRequests: [...prev.leaveRequests, { ...item, id: item.leaveId }], company: { ...prev.company, pendingLeaves: prev.company.pendingLeaves + 1 } };
        case "opening":      return { ...prev, openings: [...prev.openings, { ...item, id: item.jobId }], company: { ...prev.company, openRoles: prev.openings.length + 1 } };
        case "candidate":    return { ...prev, candidates: [...prev.candidates, { ...item, id: item.candidateId }] };
        default:             return prev;
      }
    });
  };

  const handleUpdate = (type, item) => {
    setData(prev => {
      switch (type) {
        case "candidate":  return { ...prev, candidates: prev.candidates.map(c => c.candidateId === item.candidateId ? { ...item, id: item.candidateId } : c) };
        case "payrollRun": return { ...prev, payrollRun: item };
        case "opening":    return { ...prev, openings: prev.openings.map(o => o.jobId === item.jobId ? { ...item, id: item.jobId } : o) };
        default:           return prev;
      }
    });
  };

  const handleLeaveStatus = (leave, status) => {
    fetch(`${API}/leave-requests/${leave.leaveId || leave.id}/status`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status }),
    }).then(r => r.json()).then(updated => {
      setData(prev => ({
        ...prev,
        leaveRequests: prev.leaveRequests.map(l =>
          (l.leaveId === updated.leaveId || l.id === updated.leaveId)
            ? { ...updated, id: updated.leaveId }
            : l
        ),
        company: {
          ...prev.company,
          pendingLeaves: prev.leaveRequests.filter(l =>
            l.status === "pending" && (l.leaveId || l.id) !== updated.leaveId
          ).length,
        },
      }));
    }).catch(err => console.error("Status update failed:", err));
  };

  const counts = {
    people:  DATA.employees.length,
    onboard: 4,
    docs:    DATA.pendingDocs?.length || 0,
    recruit: DATA.openings.length,
    leave:   DATA.leaveRequests.filter(l => l.status === "pending").length,
  };

  let page;
  if (route === "dashboard")  page = <DashboardPage data={DATA} onNav={setRoute} onOpenEmployee={setOpenEmployee} onOpenLeave={(l) => { setSelectedLeave(l); setRoute("leave"); }} onApproveLeave={(l) => handleLeaveStatus(l, "approved")} onDeclineLeave={(l) => handleLeaveStatus(l, "declined")} />;
  else if (route === "people") page = <PeoplePage  data={DATA} onOpenEmployee={setOpenEmployee} onAdd={handleAdd} />;
  else if (route === "leave")  page = <LeavePage   data={DATA} onApprove={(l) => handleLeaveStatus(l, "approved")} onDecline={(l) => handleLeaveStatus(l, "declined")} onAdd={handleAdd} />;
  else if (route === "recruit")page = <RecruitmentPage data={DATA} onAdd={handleAdd} onUpdate={handleUpdate} />;
  else if (route === "payroll")     page = <PayrollPage data={DATA} onUpdate={handleUpdate} />;
  else if (route === "salary")      page = <SalaryPage data={DATA} />;
  else if (route === "attend")      page = <AttendancePage data={DATA} />;
  else if (route === "permissions") page = <PermissionsPage />;
  else if (route === "org")         page = <OrgChartPage data={DATA} />;
  else if (route === "onboard")     page = <OnboardingPage data={DATA} />;
  else if (route === "shifts")      page = <ShiftsPage data={DATA} />;
  else if (route === "benefits")    page = <BenefitsPage data={DATA} />;
  else if (route === "expense")     page = <ExpensePage data={DATA} />;
  else if (route === "cashbook")    page = <CashBookPage />;
  else if (route === "daybook")     page = <DayBookPage />;
  else if (route === "parties")     page = <PartyPage />;
  else if (route === "projects")    page = <ProjectPage />;
  else if (route === "quotations")  page = <QuotationPage />;
  else if (route === "projreport")  page = <ProjectReportPage />;
  else if (route === "perf")        page = <PerformancePage data={DATA} />;
  else if (route === "learn")       page = <TrainingPage data={DATA} />;
  else if (route === "docs")        page = <DocumentsPage />;
  else if (route === "reports")     page = <ReportsPage data={DATA} />;
  else                              page = <EmptyPage route={route} onNav={setRoute} />;

  return (
    <div className="app" data-screen-label={"00 " + route}>
      <Sidebar current={route} onNav={(r) => { setRoute(r); setSelectedLeave(null); }} counts={counts} collapsed={sidebarCollapsed} onToggle={() => setSidebarCollapsed(c => !c)} user={authUser} onLogout={handleLogout} />
      <main className="main">
        <Topbar crumbs={ROUTE_CRUMBS[route] || ["HRM"]} onToggleSidebar={() => setSidebarCollapsed(c => !c)} />
        {page}
      </main>

      {openEmployee && (
        <EmployeeDrawer
          employee={openEmployee}
          onClose={() => setOpenEmployee(null)}
          departments={DATA.departments}
          onUpdate={updated => {
            setOpenEmployee(updated);
            setData(d => ({ ...d, employees: d.employees.map(e => e.empId === updated.empId ? updated : e) }));
          }}
          onDelete={empId => {
            setOpenEmployee(null);
            setData(d => ({ ...d, employees: d.employees.filter(e => e.empId !== empId) }));
          }}
        />
      )}

      <TweaksPanel title="Tweaks">
        <TweakSection label="Brand accent">
          <TweakColor label="Primary palette" value={tweaks.accent}
            options={[
              ["#6F1947", "#B61B54", "#F5989D"],
              ["#3B3E8F", "#5C4FC6", "#A6B0E8"],
              ["#1F5A3D", "#2E7D54", "#A8D2B9"],
              ["#2A2326", "#5C5156", "#A89DA3"],
            ]}
            onChange={(v) => setTweak("accent", v[0])} />
        </TweakSection>
        <TweakSection label="Density">
          <TweakRadio label="Layout" value={tweaks.density} onChange={(v) => setTweak("density", v)}
            options={[
              { value: "balanced", label: "Balanced" },
              { value: "dense",    label: "Dense" },
            ]} />
        </TweakSection>
        <TweakSection label="Canvas">
          <TweakRadio label="Tint" value={tweaks.canvas} onChange={(v) => setTweak("canvas", v)}
            options={[
              { value: "cream", label: "Cream" },
              { value: "warm",  label: "Warm" },
              { value: "cool",  label: "Cool" },
            ]} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

function EmptyPage({ route, onNav }) {
  const labels = {
    org: "Org chart", onboard: "Onboarding & offboarding",
    attend: "Attendance & time tracking", shifts: "Shift & schedule",
    benefits: "Benefits & compensation", expense: "Expense management",
    perf: "Performance management", learn: "Training & development",
    reports: "Reports & analytics",
  };
  const icons = {
    org: "git-branch", onboard: "door-open", attend: "clock", shifts: "calendar-cog",
    benefits: "gift", expense: "receipt", perf: "chart-bar", learn: "graduation-cap", reports: "file-bar-chart",
  };
  return (
    <div className="page">
      <div className="page-head">
        <div>
          <div className="eyebrow">Module</div>
          <h1 className="page-title">{labels[route] || route}</h1>
          <div className="page-sub">This module is part of the HRM roadmap. Wired through the same data model, sidebar and chrome — ready to slot in.</div>
        </div>
        <Button variant="ghost" onClick={() => onNav("dashboard")} icon="arrow-left">Back to dashboard</Button>
      </div>
      <div className="card card-pad" style={{ minHeight: 320, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center" }}>
        <div style={{ width: 64, height: 64, borderRadius: 16, background: "var(--plum-50)", color: "var(--brand-burgundy)", display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 14 }}>
          <Icon name={icons[route] || "layers"} size={32} stroke={1.6} />
        </div>
        <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>{labels[route] || route} module</div>
        <div className="muted" style={{ fontSize: 13, maxWidth: 420 }}>Submodules, forms and integrations are in the build queue. The four flagship modules (Dashboard, Employees, Leave, Recruitment, Payroll) are fully designed and clickable now.</div>
        <div className="row" style={{ gap: 10, marginTop: 18 }}>
          <Button variant="secondary" icon="layout-dashboard" onClick={() => onNav("dashboard")}>Dashboard</Button>
          <Button variant="secondary" icon="users" onClick={() => onNav("people")}>Employees</Button>
          <Button variant="secondary" icon="calendar-off" onClick={() => onNav("leave")}>Leave</Button>
          <Button variant="secondary" icon="user-plus" onClick={() => onNav("recruit")}>Recruitment</Button>
          <Button variant="secondary" icon="wallet" onClick={() => onNav("payroll")}>Payroll</Button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
